openapi: 3.0.3
info:
  title: Ecommerce API Example3
  version: 1.0.0
  description: Example OpenAPI 3 schema for an ecommerce platform (products, cart, orders).
servers:
  - url: https://api.shop.example.com/v1

paths:
  /products:
    get:
      summary: List products
      operationId: listProducts
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"

  /products/{productId}:
    get:
      summary: Get product details
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

  /cart:
    get:
      summary: Get current cart
      operationId: getCart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items:
    post:
      summary: Add item to cart
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /orders:
    post:
      summary: Create order from cart
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

    get:
      summary: List orders
      operationId: listOrders
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"

  /orders/{orderId}:
    get:
      summary: Get order
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

components:
  schemas:
    Product:
      type: object
      required: [id, name, price, currency]
      properties:
        id:
          type: string
          example: prod_001
        name:
          type: string
          example: Wireless Headphones
        description:
          type: string
          example: Noise cancelling headphones
        price:
          type: number
          format: float
          example: 199.90
        currency:
          type: string
          example: USD
        stock:
          type: integer
          example: 50
        imageUrl:
          type: string
          format: uri

    ProductList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    CartItem:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: float

    Cart:
      type: object
      properties:
        id:
          type: string
          example: cart_123
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: number
          format: float
          example: 399.80
        currency:
          type: string
          example: USD

    AddCartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1

    CreateOrderRequest:
      type: object
      required: [paymentMethod]
      properties:
        paymentMethod:
          type: string
          example: credit_card
        shippingAddress:
          $ref: "#/components/schemas/Address"

    Order:
      type: object
      required: [id, status, total, currency]
      properties:
        id:
          type: string
          example: ord_001
        status:
          type: string
          enum: [pending, paid, shipped, delivered, canceled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: number
          format: float
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
        shippingAddress:
          $ref: "#/components/schemas/Address"

    OrderList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string