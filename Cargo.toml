[package]
name = "qrud"
version = "0.1.0"
edition = "2024"
description = "Servidor HTTP de mock com semantica CRUD."
authors = ["Philippe Assis <codephilippe@gmail.com>"]
license = "Apache-2.0"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net"] }
clap = { version = "4.5.56", features = ["derive"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.149"
sqlite = "0.37.0"
serde_urlencoded = "0.7.1"
utoipa = { version = "5.0.0", features = ["macros"] }
utoipa-axum = "0.2.0"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
